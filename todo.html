<!DOCTYPE html>
<html>
<head>
    <title>TODO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadTodos()">

<h2>TODO</h2>

<input id="todoInput" placeholder="やること">
<button onclick="addTodo()">追加</button>

<br><br>

<input id="search" placeholder="検索">
<button type="button"onclick="searchTodo()">検索</button>
<button type="button" onclick="logout()">ログアウト</button>


<ul id="list"></ul>

<script>
    if (window.location.protocol ==="file:") {
        alert("不正なアクセスです。サーバーから開いてください。");
        window.location.href = "http://localhost:3000/index.html";
    } 
    async function logout() {
        try{
            const response = await fetch("http://localhost:3000/logout",{
                method: "POST"
            });
            if (response.ok){
                window.location.href = "http://localhost:3000/index.html";
            } else {
                alert("ログアウトに失敗しました。");
            }
        } catch (error) {
            console.error(error);
        }
    }
    async function toggleTodo(index, completed) {
        await fetch(`http://localhost:3000/todos/${index}`,{
            method: "PUT",
            headers: { "Content-Type": "application/json"},
            body: JSON.stringify({ completed: completed })
        });
        loadTodos();
    }

async function addTodo() {
    const text = document.getElementById("todoInput").value.trim();
if (!text)return;
    await fetch("http://localhost:3000/add",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({ text })
    });
    loadTodos();
}
    async function register() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const response = await fetch("http://localhost:3000/register",{
            method:"POST",
            headers:{
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });
        const data = await response.json();

        alert(data.message);
    }
    
async function loadTodos(){
  const res = await fetch("http://localhost:3000/todos");
    const data = await res.json();
 renderList(data);
}
loadTodos();
function renderList(data){
const list = document.getElementById("list");
    list.innerHTML ="";

    data.forEach((todo,index)=>{
        if (!todo) return;

        const li=document.createElement("li");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    li.appendChild(checkbox);
    li.appendChild(document.createTextNode(todo.text));

    checkbox.onchange = () => toggleTodo(todo.id,checkbox.checked);

    const span = document.createElement("span");

    span.textContent = todo.text || "";
    if(checkbox.checked) {
        span.style.textDecoration ="line-through";
        span.style.color ="#888";
    }
    li.appendChild(span);
    checkbox.checked = todo.status === 1 || todo.status === true || todo.status ==='1';
    checkbox.onchange = () => {
        const isChecked = checkbox.checked;
        if (isChecked){
            span.style.textDecoration ="line-through";
        span.style.color ="#888";
        }else{
            span.style.textDecoration="none";
            span.style.color = "";

            method: 'POST',
            headers: {
                'Content-Type':'application/json'
            },
            body: JSON.stringify({ status: isChecked ?'1' :'0'})
        })
        .then(response => {
            console.log('サーバーの更新が成功しました');
        })
        .catch(error =>{
            console.error('エラーが発生しました:', error);
        });
    };

    if (todo.completed) {
        span.style.textDecoration ="line-through";
        span.style.color = "#888";
    }

    const btn = document.createElement("button");
    btn.textContent = "削除";
    btn.onclick = () => deleteTodo(todo.id);

    li.appendChild(checkbox);
    li.appendChild(span);
    li.appendChild(btn);
    list.appendChild(li);
    });
}

async function searchTodo(){
    console.log("クリックされた");
    const keyword=document.getElementById("search").value;
    console.log("入力:",keyword);
    const url = keyword
    ? `http://localhost:3000/todos?search=${encodeURIComponent(keyword)}`
    : "http://localhost:3000/todos";
    const res = await fetch(url);
    const data = await res.json();
    
    console.log(data);

    renderList(data);
}
    
async function deleteTodo(idOrIndex) {
    await fetch(`http://localhost:3000/delete/${idOrIndex}`, {
        method: "DELETE"
    });
    loadTodos();
}


</script>
</body>
</html>
